<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>홀리데이 접시 쌓기 · 데일리라이크</title>
<meta name="description" content="접시를 17층까지 쌓으면 접시 장인! 데일리라이크 홀리데이 미니 플레이트 이벤트">
<meta property="og:title" content="홀리데이 접시 쌓기 · 데일리라이크">
<meta property="og:description" content="17층까지 쌓으면 접시 장인! 도전해 보세요 🎅">
<meta name="theme-color" content="#f1a9be">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#f1a9be;--green:#2c6841;--red:#d92924;--ink:#231f20;--card:#fff;--soft:#7d6e60;color-scheme:light;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--pink);font-family:var(--font);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
.app{position:relative;width:min(100%,480px);height:100%;margin:0 auto;overflow:hidden;border-left:10px solid var(--green);border-right:10px solid var(--green)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.pill{background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:800;pointer-events:auto;border:0;font-family:inherit;cursor:pointer}
.floor{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:5;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(150,40,50,.35)}
.floor b{display:block;font-size:3.4rem;line-height:1}
.floor small{font-size:.85rem}
.pop{position:absolute;left:50%;top:32%;transform:translateX(-50%);z-index:6;color:#fff;font-weight:800;font-size:1.6rem;pointer-events:none;opacity:0;white-space:nowrap;text-shadow:0 2px 0 rgba(150,40,50,.4)}
.pop.on{animation:pp 1s ease-out}
.pop.big{font-size:2rem;color:#fff6c8}
@keyframes pp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px) scale(1.1)}}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;background:rgba(241,169,190,.95);overflow-y:auto}
#over{background:rgba(241,169,190,.15);justify-content:flex-start}
#over>.card{margin-top:auto;box-shadow:0 8px 24px rgba(120,40,50,.18)}
#start{justify-content:flex-start}
#start>.hero{margin-top:auto}
.hero-photo{width:min(100%,320px);aspect-ratio:720/602;object-fit:cover;border:8px solid #fff;border-radius:18px;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(120,40,50,.25);margin:4px 0 14px;flex:none}
#start>.btn:last-child{margin-bottom:auto}
.hero{width:min(100%,320px);height:auto;margin:-6px 0 4px}
.screen h1{margin:0 0 4px;font-size:1.7rem;font-weight:800;color:var(--green)}
.screen p{margin:0 0 14px;font-size:.92rem;color:#4a2a30;line-height:1.6;word-break:keep-all}
.dd{display:inline-block;background:var(--card);color:var(--red);font-weight:800;font-size:.85rem;border-radius:999px;padding:5px 14px;margin-bottom:10px;white-space:nowrap}
.chal{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:.85rem;border-radius:14px;padding:7px 14px;margin-bottom:10px;word-break:keep-all;line-height:1.5}
.event{width:min(100%,320px);background:#fff;border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:.84rem;line-height:1.6;color:#3a2410;font-weight:700;word-break:keep-all;text-align:left}
.event{padding:14px 16px;font-size:.88rem}
.ev-head{font-size:.95rem}
.ev-how{margin:4px 0 12px}
.ev-prize{display:flex;gap:14px;align-items:center;background:#fdecee;border-radius:12px;padding:12px 12px 14px}
.ev-gift{font-weight:800;color:#3a2410;line-height:1.55;white-space:nowrap;font-size:clamp(.78rem,3.7vw,.88rem)}
.ev-prize small{white-space:nowrap}
@media (max-width:380px){.ev-prize{gap:10px;padding:10px 10px 14px}.zoom{width:64px!important;height:82px!important}.event{padding:12px 12px}}
.ev-prize small{margin-top:4px!important;font-size:.76rem;line-height:1.5}
.event .prize{width:78px;height:98px;object-fit:cover;border-radius:10px;flex:none;transform:rotate(-3deg);box-shadow:0 3px 8px rgba(120,40,50,.2)}
.event b{color:var(--red)}
.why{color:var(--red)}
.ev-head{font-weight:800;color:var(--green);margin-bottom:2px}
#photoSub{white-space:pre-line;line-height:1.6}
.prize-row{display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:8px;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.prize-row .thumb{position:relative;flex:none;width:84px;height:84px}
.prize-row .thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.prize-row .thumb i{position:absolute;right:-4px;bottom:-4px;background:var(--green);color:#fff;font-style:normal;font-size:.7rem;font-weight:800;border-radius:999px;padding:3px 7px;border:2px solid #fff}
.prize-row span{font-size:.86rem;font-weight:700;line-height:1.5}
.prize-row span u{display:block;margin-top:2px;color:var(--green);font-size:.8rem;text-underline-offset:3px}
.zoom{position:relative;flex:none;width:76px;height:96px;padding:0;border:0;background:none;cursor:zoom-in;transform:rotate(-3deg)}
.zoom img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;box-shadow:0 3px 8px rgba(120,40,50,.25)}
.zoom span{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;background:var(--red);color:#fff;font:inherit;font-size:.7rem;font-weight:800;border-radius:999px;padding:4px 9px;border:2px solid #fff;box-shadow:0 2px 6px rgba(120,40,50,.3);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}
@media (prefers-reduced-motion:reduce){.zoom span{animation:none}}
#photoScr{background:rgba(35,20,25,.95);z-index:20;justify-content:center}
#photoScr img{width:auto;max-width:min(100%,400px);max-height:66vh;border-radius:14px;border:6px solid #fff;flex:none}
#photoScr h2{margin:14px 0 2px;color:#fff;font-size:1.15rem;font-weight:800}
#photoScr p{color:#f6dbe2;margin:0 0 14px}
@keyframes zin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#photoScr:not([hidden]) img{animation:zin .25s ease-out}
.event small{display:block;margin-top:4px;color:var(--soft);font-weight:700}
.btn{width:min(100%,300px);border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:1.02rem;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 4px 0 #1b4329;flex:none}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:none;margin-top:8px;padding:12px}
.btn.red{background:var(--red);box-shadow:0 4px 0 #8e1a17;margin-top:10px}
.btn:focus-visible,.pill:focus-visible,.linkish:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card{background:var(--card);border-radius:22px;padding:18px;width:min(100%,320px);margin-bottom:12px;color:var(--ink);flex:none}
.card .big{font-size:3rem;font-weight:800;color:var(--red);line-height:1.1}
.card small{color:var(--soft);font-weight:700}
.badge{display:inline-block;margin-top:8px;background:var(--red);color:#fff;font-weight:800;border-radius:999px;padding:5px 14px;font-size:.95rem}
.status{margin-top:10px;padding:12px;border-radius:14px;background:#fdecee;color:#3a2410;font-weight:700;line-height:1.6;word-break:keep-all;font-size:.88rem}
.status b{color:var(--red)}
.vs{margin-top:10px;font-weight:800;font-size:.92rem;word-break:keep-all}
.vs.win{color:var(--green)}.vs.lose{color:var(--soft)}
.linkish{background:none;border:0;padding:6px;margin-top:6px;font:inherit;font-weight:800;font-size:.88rem;cursor:pointer;color:var(--green);text-decoration:underline;text-underline-offset:3px}
.hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;color:#fff;font-weight:800;font-size:.88rem;pointer-events:none;background:var(--green);border-radius:999px;padding:8px 16px;white-space:nowrap;box-shadow:0 3px 0 #1b4329}
.toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--green);color:#fff;font-weight:800;font-size:.85rem;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.copybox{display:flex;gap:6px;margin-top:8px;width:min(100%,300px);flex:none}
.copybox input,.namebox input{flex:1;min-width:0;border:1.5px solid #e3c9cf;border-radius:10px;padding:10px;font:inherit;font-size:.85rem;background:#fff;color:#231f20;user-select:text;-webkit-user-select:text}
.namebox input{width:100%;font-size:1.1rem;font-weight:800;text-align:center;margin:12px 0 6px}
.err{color:var(--red);font-size:.8rem;font-weight:700;min-height:1.2em}
#cardImg{max-width:min(100%,300px);max-height:58vh;border-radius:14px;box-shadow:0 8px 24px rgba(120,40,50,.25);flex:none;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.save-tip{margin:10px 0 2px!important;font-size:.85rem!important}
@media (prefers-reduced-motion:reduce){.pop.on{animation-duration:.01s}}
</style>
</head>

const KEYS = Object.keys(IMGS);
const img = {};
[...KEYS, 'scene'].forEach(k => { const i = new Image(); i.src = k === 'scene' ? SCENE : IMGS[k]; img[k] = i; });
img.product = new Image(); img.product.src = PRODUCT;

const GOAL = CONFIG.goal;
const kst = () => new Date(Date.now() + 9*3600e3);
const today = () => kst().toISOString().slice(0,10);
const dn = s => Math.round(Date.parse(s + 'T00:00:00Z')/864e5);
const [, om, od] = CONFIG.openDate.split('-').map(Number);
const toOpen = dn(CONFIG.openDate) - dn(today()), toXmas = dn(today().slice(0,4) + '-12-25') - dn(today());
const ddayText = () => toOpen > 0 ? `${om}월 ${od}일 플레이트 오픈까지 D-${toOpen}` : toOpen === 0 ? `오늘 ${om}월 ${od}일 플레이트 오픈!` : toXmas > 0 ? `크리스마스까지 D-${toXmas}` : 'Merry Christmas';
$('dday').textContent = ddayText();
$('goalTxt').textContent = GOAL + '층';
$('floorSub').textContent = `/ ${GOAL}층`;
(() => {
  $('evHead').textContent = `🎅 ${GOAL}층까지 쌓는 걸 성공하신다면!`;
  const h = $('evHow'); h.textContent = ''; h.append('결과 카드를 스토리에 올리고', document.createElement('br'));
  const b = document.createElement('b'); b.textContent = CONFIG.brand; h.append(b, '를 태그해 주세요!');

/* ---------- nickname ---------- */
const BAD = ['시발','씨발','ㅅㅂ','ㅆㅂ','병신','ㅂㅅ','좆','존나','개새','새끼','니미','엠창','섹스','fuck','shit','sex','bitch'];
function cleanName(v){ return (v || '').replace(/[<>"'`\\\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 8); }
const isBad = v => { const t = v.replace(/\s/g, '').toLowerCase(); return BAD.some(w => t.includes(w)); };
let nick = cleanName(S.get('nick') || '');
let afterName = null;
function askName(then){
  afterName = then; $('nameIn').value = nick; $('nameErr').textContent = ''; $('nameScr').hidden = false;
  setTimeout(() => $('nameIn').focus(), 50);
}
function withName(then){ if (nick) then(); else askName(then); }
function confirmName(){
  const v = cleanName($('nameIn').value);
  if (!v){ $('nameErr').textContent = '닉네임을 입력해 주세요'; return; }
  if (isBad(v)){ $('nameErr').textContent = '다른 닉네임을 써 주세요'; return; }
  nick = v; S.set('nick', v); $('nameScr').hidden = true;
  const f = afterName; afterName = null; if (f) f();
}
$('nameOk').addEventListener('click', confirmName);
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') confirmName(); });
$('nameCancel').addEventListener('click', () => { $('nameScr').hidden = true; afterName = null; });

/* ---------- friend challenge (?from=지민&score=12) ---------- */
let target = 0, fromName = '';
(() => {
  const q = new URLSearchParams(location.search), sc = parseInt(q.get('score'), 10);
  if (sc >= 1){ target = Math.min(GOAL, sc); const f = cleanName(q.get('from')); fromName = f && !isBad(f) ? f : ''; }
  if (!target) return;
  const who = fromName ? `${fromName}님` : '친구';
  $('chal').textContent = target >= GOAL ? `🎁 ${who}의 도전장\n이미 ${GOAL}층 접시 장인이에요. 따라잡아 보세요!` : `🎁 ${who}의 도전장\n${target}층을 넘겨 보세요!`;
  $('chal').style.whiteSpace = 'pre-line'; $('chal').hidden = false; $('go').textContent = '도전 받기';
})();
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1900); }

/* ---------- game ---------- */
const cv = $('cv'), g = cv.getContext('2d');
let W, H, dpr;
function size(){ dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; g.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', size); size();
const PW = () => Math.min(150, W*.4);        // plate width
const STEP = () => PW()*.36;                 // vertical step per floor
const speedFor = f => CONFIG.speeds.find(([upTo]) => f <= upTo)[1];
const groundY = () => H - 96;
let st = null, last5 = null;
function newGame(){
  st = { stack:[], cur:null, falling:[], z:1, oy:0, over:false, win:false, combo:0 };
  st.stack.push({ k:KEYS[Math.random()*4|0], x:W/2, y:groundY() - PW()*.5, r:0 });
  st.snap = snapOf(st.stack); spawn();
}
const snapOf = s => s.map(p => ({ k:p.k, dx:p.x - s[0].x, r:p.r || 0 }));
function spawn(){
  const f = st.stack.length, k = KEYS[Math.random()*4|0], speed = speedFor(f);
  if (f > 1 && speed > speedFor(f - 1)){ popText('⚡ 속도 UP!', true); speedUp(); }
  const topY = st.stack[f-1].y - STEP();
  st.cur = { k, x: Math.random() < .5 ? PW()*.55 : W - PW()*.55, dir: Math.random() < .5 ? 1 : -1, speed, y: topY - H*.25, targetY: topY, drop:false, vy:0 };
}
function tap(){
  if (!st || st.over || !st.cur || st.cur.drop) return;
  audio(); st.cur.drop = true; st.cur.vy = 0;
}
function land(c){
  const top = st.stack[st.stack.length-1], dx = c.x - top.x, w = PW();
  const t = audio().currentTime;
  if (Math.abs(dx) > w*.4){ // missed
    st.falling.push({ ...c, vx: Math.sign(dx)*60, vr: Math.sign(dx)*3, vy: 80 }); st.cur = null;
    thud(); return finish(st.stack.length - 1, '앗, 떨어졌어요!');
  }
  const perfect = Math.abs(dx) < 10;
  c.x = perfect ? top.x : top.x + dx;
  if (perfect){ st.combo++; popText(st.combo > 1 ? `퍼펙트 x${st.combo}` : '퍼펙트!'); chime(); }
  else st.combo = 0;

    if (off > w*.5){ st.cur = null; topple(Math.sign(cm - s[i].x) || 1); return; }

  }
  st.snap = snapOf(s);

  else if (GOAL - n === 7) setTimeout(() => popText(`장인까지 7층! 🎅`, true), 150);
  if (target && target < GOAL && n === target + 1){ popText('친구 기록 돌파! 🎉', true); chime(); }

function topple(dir){

function finish(n, why, win){

let result = null;
function hashCode(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().padStart(6, '0').slice(-6); }

let popT; function popText(t, big){ const p = $('pop'); p.textContent = t; p.classList.toggle('big', !!big); p.classList.remove('on'); void p.offsetWidth; p.classList.add('on'); }

function drawPlate(p, extraR){
  const i = img[p.k]; if (!i || !i.naturalWidth) return;
  const w = PW(), h = w * i.naturalHeight / i.naturalWidth;
  g.save(); g.translate(p.x, p.y); g.rotate((p.r || 0) + (extraR || 0));
  g.shadowColor = 'rgba(35,31,32,.22)'; g.shadowBlur = 0; g.shadowOffsetY = 5;
  g.drawImage(i, -w/2, -h/2, w, h); g.restore();
}
function drawScene(){ const sc = img.scene; if (!sc.naturalWidth) return; const z = st ? st.z : 1, sw = W/z + 4, sh = sw * sc.naturalHeight / sc.naturalWidth, top = groundY() + 70 - sh, x0 = W/2 - sw/2;
  g.drawImage(sc, x0, top, sw, sh); g.fillStyle = '#fff'; g.fillRect(x0, top + sh - 2, sw, 4000/z); }
const FF = '"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif';
function drawLine(floor, label, col){
  const z = st.z, y = groundY() - PW()*.5 - floor*STEP() - PW()*.22;
  const x0 = W/2 - W/(2*z) + 8/z, x1 = W/2 + W/(2*z) - 8/z;
  g.save(); g.strokeStyle = col; g.lineWidth = 2.5/z; g.setLineDash([8/z, 6/z]);

  g.font = `800 ${13/z}px ${FF}`;
  const tw = g.measureText(label).width, ph = 22/z, pw = tw + 16/z, lx = x1 - pw;
  g.fillStyle = col;
  if (g.roundRect){ g.beginPath(); g.roundRect(lx, y - ph/2, pw, ph, ph/2); g.fill(); } else g.fillRect(lx, y - ph/2, pw, ph);
  g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(label, lx + 8/z, y + 1/z); g.restore();
}
function drawLines(){
  if (!st) return;
  const n = st.stack.length - 1;
  if (target && target < GOAL) drawLine(target, n > target ? '친구 기록 돌파!' : `${fromName || '친구'} ${target}층`, n > target ? '#2c6841' : '#d92924');
  drawLine(GOAL, st.win ? '🎅 장인 달성!' : `🎅 ${GOAL}층 접시 장인`, '#2c6841');

/* camera: zoom out as the tower grows (min 0.45), then pan; on game over pull back to show the whole tower */
function camTarget(){
  const wb = groundY() + 60, P = PW();
  if (st.over){
    let top = wb - P;
    st.stack.concat(st.falling).forEach(p => { top = Math.min(top, p.y - P*.6); });
    const aTop = 110, aBot = H - Math.min(H*.55, 420);
    const z = Math.min(1, (aBot - aTop)/(wb - top));
    return { z, oy: aBot - wb*z };
  }
  const tY = st.stack[st.stack.length-1].y - STEP();
  const top = Math.min(st.cur ? st.cur.y : tY - H*.25, tY - H*.25) - P*.6, pad = 120;
  const z = Math.max(.45, Math.min(1, (H - pad)/(wb - top)));
  return { z, oy: Math.max(H - wb*z, pad - top*z) };
}
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  g.clearRect(0,0,W,H);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineCap = 'round';
  for (let i = 0; i < 46; i++){ const x = (i*97.3 % W) + Math.sin(now/1400 + i)*6, y = ((i*53.7 + now*.018*(1 + i%3)) % (H+20)) - 10;
    if (i % 5 === 0){ const r = 4 + i%3*1.5, a = now/2400 + i; g.lineWidth = 1.6; g.beginPath();
      for (let k = 0; k < 3; k++){ const t = a + k*Math.PI/3; g.moveTo(x - Math.cos(t)*r, y - Math.sin(t)*r); g.lineTo(x + Math.cos(t)*r, y + Math.sin(t)*r); } g.stroke(); }
    else { g.beginPath(); g.arc(x, y, 1.4 + i%3*.8, 0, 7); g.fill(); } }
  if (st){
    const ct = camTarget(), ck = Math.min(1, dt*(st.over ? 2.4 : 3.5));
    st.z += (ct.z - st.z)*ck; st.oy += (ct.oy - st.oy)*ck;
    g.save(); g.translate(W/2, st.oy); g.scale(st.z, st.z); g.translate(-W/2, 0);
    drawScene(); drawLines();
    st.stack.forEach(p => drawPlate(p));
    if (st.cur){
      const c = st.cur;
      if (!c.drop){ c.x += c.dir*c.speed*dt; const m = PW()*.5; if (c.x > W - m){ c.x = W - m; c.dir = -1; } if (c.x < m){ c.x = m; c.dir = 1; } c.y += (c.targetY - H*.25 - c.y)*Math.min(1, dt*6); }
      else { c.vy += 2200*dt; c.y += c.vy*dt; if (c.y >= c.targetY){ c.y = c.targetY; land(c); } }
      if (st.cur){
        if (!c.drop && st.stack.length < 4){ g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.5; g.setLineDash([4,6]); g.beginPath(); g.moveTo(c.x, c.y + 20); g.lineTo(c.x, c.targetY - 10); g.stroke(); g.setLineDash([]); }
        drawPlate(c);
      }
    }
    st.falling.forEach(f => { f.vy += 1400*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.r = (f.r||0) + f.vr*dt;

}

/* ---------- sounds & carols ---------- */
function chime(){ const c = audio(), t = c.currentTime; [84,88,91].forEach((m,i) => INST.musicbox(hz(m), t + .05*i, .2, master)); }
function thud(){ const c = audio(), t = c.currentTime, o = c.createOscillator(), gn = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(70, t+.3); gn.gain.setValueAtTime(.4, t); gn.gain.exponentialRampToValueAtTime(.001, t+.35); o.connect(gn); gn.connect(master); o.start(t); o.stop(t+.4); sleigh(); }
let tune = null, muted = false, qi = 0, gapT;
const LIST = ['Jingle Bells','Twinkle Twinkle Little Star','We Wish You a Merry Christmas','Deck the Halls','Mary Had a Little Lamb'].map(t => SONGS.find(s => s.t === t));
const NM = { 'Jingle Bells':'징글벨','Twinkle Twinkle Little Star':'반짝반짝 작은 별','We Wish You a Merry Christmas':'We Wish You','Deck the Halls':'Deck the Halls','Mary Had a Little Lamb':'떴다 떴다 비행기' };
function stopTune(){ if (!tune) return; clearInterval(tune.timer); clearTimeout(gapT); const t = ctx.currentTime; tune.bus.gain.setValueAtTime(tune.bus.gain.value, t); tune.bus.gain.linearRampToValueAtTime(0, t+.3); tune = null; }
function playQ(){ if (muted) return; const s = LIST[qi % LIST.length], c = audio(); stopTune(); const bus = c.createGain(); bus.gain.value = .6; bus.connect(musicBus);
  const spb = 60/s.bpm, start = c.currentTime + .3, me = tune = { bus, mi:0, ci:0 };
  me.timer = setInterval(() => { const h = c.currentTime + .25;
    while (me.mi < s.ev.length && start + s.ev[me.mi].beat*spb < h){ const e = s.ev[me.mi++]; INST.xylo(hz(e.midi), start + e.beat*spb, .18, bus); }
    while (me.ci < s.chords.length && start + s.chords[me.ci].beat*spb < h){ const k = s.chords[me.ci++], t = start + k.beat*spb, d = k.dur*spb; pad(k.pcs.map(q => 55 + ((q-55)%12+12)%12), t, d, bus); bass(36 + k.root, t, d, bus); }
    if (c.currentTime > start + s.total*spb + 1 && tune === me){ clearInterval(me.timer); tune = null; gapT = setTimeout(() => { qi++; playQ(); }, 1000); } }, 30);
  $('snd').textContent = '♪ ' + NM[s.t]; }

/* ---------- result card (1080 x 1920, story size) ---------- */
async function makeCard(){
  try { await document.fonts.ready; } catch(e){}
  const C = document.createElement('canvas'); C.width = 1080; C.height = 1920;
  const x = C.getContext('2d'), F = (wt, px) => `${wt} ${px}px ${FF}`;
  const r = result, Wc = 1080;
  x.fillStyle = '#f1a9be'; x.fillRect(0, 0, Wc, 1920);
  // snow
  let seed = 7; const rnd = () => (seed = (seed*9301 + 49297) % 233280) / 233280;
  x.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 90; i++){ x.beginPath(); x.arc(40 + rnd()*1000, rnd()*1920, 3 + rnd()*5, 0, 7); x.fill(); }
  x.fillStyle = '#2c6841'; x.fillRect(0, 0, 30, 1920); x.fillRect(Wc - 30, 0, 30, 1920);
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  // header
  const pill = (txt, cx, cy, bg, fg, px) => { x.font = F(800, px); const w = x.measureText(txt).width + px*1.4, h = px*1.75;
    x.fillStyle = bg; x.beginPath(); x.roundRect ? x.roundRect(cx - w/2, cy - h/2, w, h, h/2) : x.rect(cx - w/2, cy - h/2, w, h); x.fill();
    x.fillStyle = fg; x.textBaseline = 'middle'; x.fillText(txt, cx, cy + px*.06); x.textBaseline = 'alphabetic'; };
  pill(ddayText(), Wc/2, 270, '#fff', '#d92924', 34);
  x.font = F(800, 84); x.fillStyle = '#2c6841'; x.fillText('홀리데이 접시 쌓기', Wc/2, 400);
  x.font = F(800, 46); x.fillStyle = '#fff'; x.shadowColor = 'rgba(150,40,50,.35)'; x.shadowOffsetY = 4;
  x.fillText(`${nick}님의 기록`, Wc/2, 490);
  x.font = F(800, 190); x.fillText(`${r.n}층`, Wc/2, 690); x.shadowColor = 'transparent'; x.shadowOffsetY = 0;
  if (r.win) pill(`🎅 ${GOAL}층 접시 장인`, Wc/2, 770, '#d92924', '#fff', 48);
  else { x.font = F(800, 38); x.fillStyle = '#4a2a30'; x.fillText(`접시 장인까지 ${GOAL - r.n}층!`, Wc/2, 775); }
  // scene + tower
  const sc = img.scene, sw = 640, sh = sw * sc.naturalHeight / sc.naturalWidth, sBot = 1540, sTop = sBot - sh;
  const sCx = 345; x.drawImage(sc, sCx - sw/2, sTop, sw, sh);
  x.fillStyle = '#fff'; x.fillRect(sCx - sw/2, sBot - 2, sw, 6);
  const snap = r.snap || [], baseBot = sBot - sh*.2, avail = baseBot - 840;
  const pw = Math.min(260, avail / (Math.max(0, snap.length - 1)*.36 + 1.05)), step = pw*.36;
  snap.forEach((p, i) => { const im = img[p.k]; if (!im || !im.naturalWidth) return; const h = pw * im.naturalHeight / im.naturalWidth;
    const cy = baseBot - pw*.5 - i*step; x.save(); x.translate(sCx + p.dx * pw / PW(), cy); x.rotate(p.r);
    x.shadowColor = 'rgba(35,31,32,.22)'; x.shadowOffsetY = 8; x.drawImage(im, -pw/2, -h/2, pw, h); x.restore(); });
  // product polaroid
  const pd = img.product;

    x.save(); x.translate(790, 1180); x.rotate(.06);
    const pwd = 400, phd = pwd * pd.naturalHeight / pd.naturalWidth;
    x.shadowColor = 'rgba(80,30,40,.28)'; x.shadowBlur = 24; x.shadowOffsetY = 10;
    x.fillStyle = '#fff'; x.fillRect(-pwd/2 - 16, -phd/2 - 16, pwd + 32, phd + 92);

    x.fillStyle = '#d92924'; x.font = F(800, 34); x.textAlign = 'center';

    x.restore();

  x.fillStyle = '#fff'; x.beginPath(); x.roundRect ? x.roundRect(110, 1580, 860, 170, 40) : x.rect(110, 1580, 860, 170); x.fill();

  } else {
    x.fillText(`${CONFIG.brand} 게시물에`, Wc/2, 1652);
    x.fillText(`'플레이트' 댓글 남기고 도전!`, Wc/2, 1712);
  }
  return C;
}

function challengeLink(){

async function sendChallenge(){
